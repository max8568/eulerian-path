<title>一筆畫試玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one full-height screen — level bar on top, drawing stage, three big buttons below (portrait) or in a right-hand column (landscape). Single deliberate light look, same paper blue as the input prototype. */
:root {
  --paper: #EAF3F7;
  --ink: #1F3442;
  --todo: #B6C8D3;
  --draw: #F2542D;
  --here: #FFC93C;
  --hint: #1FA463;
  --panel: #FFFFFF;
  --soft: #D5E4EC;
  --font-ui: "Fredoka", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-ui);
  display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; overflow: hidden;
  user-select: none; -webkit-user-select: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
@media (orientation: landscape) {
  body { grid-template-rows: auto 1fr; grid-template-columns: 1fr auto; }
  header { grid-column: 1 / -1; }
  #tools { flex-direction: column; justify-content: center; padding: 8px 20px 16px 8px; }
}
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
#level-tag { flex: 1; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.round { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--panel); color: var(--ink); font: 600 22px var(--font-ui); cursor: pointer; display: grid; place-items: center; }
#skip-btn svg { width: 28px; height: 28px; }
#skip-btn.armed { background: var(--draw); color: var(--panel); transform: scale(1.25); animation: blink .5s ease-in-out infinite alternate; }
@keyframes blink { to { opacity: .55; } }
#gear { background: transparent; }
#stage { position: relative; min-height: 0; min-width: 0; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#tools { display: flex; justify-content: center; gap: 22px; padding: 12px 16px 18px; }
.tool { position: relative; overflow: hidden; width: 76px; height: 76px; border-radius: 24px; border: 0; cursor: pointer; background: var(--panel); color: var(--ink); box-shadow: 0 4px 0 var(--soft); display: grid; place-items: center; }
.tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soft); }
.tool:focus-visible, .round:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.tool svg { width: 40px; height: 40px; }
#hint-btn { color: var(--hint); }
#hint-btn:disabled { opacity: .45; cursor: default; }
#hint-btn .cool { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--hint); }
#hint-btn.cooling .cool { animation: fill 5s linear forwards; }
@keyframes fill { to { width: 100%; } }
#hint-btn.bounce { animation: bounce 1s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-14px); } 55% { transform: translateY(0); } 70% { transform: translateY(-6px); } }

.e-todo { stroke: var(--todo); stroke-width: 10; fill: none; stroke-linecap: round; }
.e-done { stroke: var(--draw); stroke-width: 12; fill: none; stroke-linecap: round; }
.e-part { stroke: var(--draw); stroke-width: 12; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.v { fill: var(--panel); stroke: var(--ink); stroke-width: 4; }
.v-here { fill: var(--here); stroke: var(--ink); stroke-width: 4; }
.ring { fill: none; stroke: var(--here); stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
.nudge { animation: nudge .5s ease-in-out 2; transform-box: fill-box; transform-origin: center; }
@keyframes nudge { 50% { transform: scale(1.5); } }
.hint-line { stroke: var(--hint); stroke-width: 14; fill: none; stroke-linecap: round; animation: trace 1s ease-in-out 2 forwards; }
@keyframes trace { to { stroke-dashoffset: 0; } }
.hint-dot { fill: none; stroke: var(--hint); stroke-width: 6; transform-box: fill-box; transform-origin: center; animation: hdot .8s ease-in-out 3; }
@keyframes hdot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(234,243,247,.85); }
.overlay .box { display: grid; justify-items: center; gap: 18px; text-align: center; font-size: 22px; }
.star { width: 140px; height: 140px; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
.big-btn { font: 600 22px var(--font-ui); padding: 14px 32px; border-radius: 22px; border: 0; background: var(--ink); color: var(--panel); cursor: pointer; }

#panel { position: fixed; inset: 0; background: rgba(31,52,66,.35); display: grid; place-items: center; padding: 16px; z-index: 5; }
#panel .sheet { background: var(--panel); border-radius: 18px; padding: 18px 20px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 14px; font-size: 15px; user-select: text; -webkit-user-select: text; }
#panel h2 { margin: 0; font-size: 18px; }
#panel .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#panel input { font: inherit; padding: 6px 10px; border: 2px solid var(--soft); border-radius: 10px; width: 9em; }
#panel .note { margin: 0; color: #5B6E7B; font-size: 13px; }
#jump { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
#jump button { font: 600 15px var(--font-ui); height: 40px; border-radius: 10px; border: 2px solid var(--soft); background: var(--panel); color: var(--ink); cursor: pointer; }
#jump button.cleared { background: var(--here); border-color: var(--here); }
#jump button.skipped { border-style: dashed; border-color: var(--ink); }
#jump button.now { border-color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--soft); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
#close-panel { justify-self: end; font: 600 16px var(--font-ui); padding: 8px 20px; border-radius: 12px; border: 0; background: var(--ink); color: var(--panel); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .ring, #hint-btn.bounce, .star, #skip-btn.armed { animation: none; } }
</style>

<header>
  <button class="round" id="gear" aria-label="家長設定">⚙</button>
  <div id="level-tag">第 1 關</div>
  <button class="round" id="skip-btn" aria-label="跳過（按兩下）">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M4 5l10 9-10 9zM14 5l10 9-10 9z"/></svg>
  </button>
</header>

<div id="stage">
  <svg id="svg" aria-label="畫圖區"><g id="g-edges"></g><g id="g-part"></g><g id="g-fx"></g><g id="g-verts"></g></svg>
  <div class="overlay" id="win" hidden>
    <div class="box">
      <svg class="star" viewBox="0 0 100 100" aria-label="過關"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="#FFC93C" stroke="#1F3442" stroke-width="4" stroke-linejoin="round"/></svg>
      <button class="big-btn" id="next-btn">下一關 ▶</button>
    </div>
  </div>
  <div class="overlay" id="finished" hidden>
    <div class="box">
      <svg class="star" viewBox="0 0 100 100" aria-label="全部玩完"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="#FFC93C" stroke="#1F3442" stroke-width="4" stroke-linejoin="round"/></svg>
      <div>全部玩完了！</div>
    </div>
  </div>
</div>

<div id="tools">
  <button class="tool" id="undo-btn" aria-label="退一步"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10 6 18l8 8"/><path d="M6 18h18a10 10 0 0 1 0 20h-6"/></svg></button>
  <button class="tool" id="restart-btn" aria-label="重來"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 20a12 12 0 1 1-4-9"/><path d="M30 4v8h-8"/></svg></button>
  <button class="tool" id="hint-btn" aria-label="提示"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 27c0-4-5-6-5-13a11 11 0 0 1 22 0c0 7-5 9-5 13z"/><path d="M15 33h10M17 38h6"/></svg><span class="cool"></span></button>
</div>

<div id="panel" hidden>
  <div class="sheet">
    <h2>家長設定</h2>
    <div class="row">
      <label for="kid-name">誰在玩</label><input id="kid-name" placeholder="名字或代號">
      <label for="kid-age">幾歲</label><input id="kid-age" inputmode="numeric" placeholder="例如 7">
    </div>
    <p class="note" id="db-status">紀錄存放：連線中…</p>
    <div>
      <p class="note">跳到某一關（黃色是過關，虛線是跳過）：</p>
      <div id="jump"></div>
    </div>
    <div class="table-wrap"><table id="results"></table></div>
    <button id="close-panel">好了</button>
  </div>
</div>

// ---- records

    level: li + 1, figure: lv.id, shape: lv.name, result,
    seconds: log.t0 ? Math.round((Date.now() - log.t0) / 1000) : 0,

function loadLevel(i) {

}
function chooseStart(v) {

}
function commit(e) {

}

}

}
function hint() {

  active = null; let bestT = 0;
  for (const e of incident(cur)) {
    const { t, d } = nearest(poly(e, cur), p), was = prog.get(e) || 0;
    if (d > TOL) continue;
    if (t <= was + 0.35) prog.set(e, Math.max(was, t));
    if ((prog.get(e) || 0) > bestT) { bestT = prog.get(e); active = e; }
  }
  if (active != null && (bestT >= 0.9 || (bestT >= 0.5 && dist(p, V[other(active, cur)]) <= R * 0.8))) commit(active);
  render();
});
const endDrag = () => { if (!dragging) return; dragging = false; prog.clear(); active = null; render(); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

// ---- parent panel
function renderPanel() {
  const cleared = store.get('cleared', []), skipped = store.get('skipped', []);
  $('jump').innerHTML = LEVELS.map((_, i) => `<button data-i="${i}" class="${cleared.includes(i) ? 'cleared' : skipped.includes(i) ? 'skipped' : ''}${i === li ? ' now' : ''}">${i + 1}</button>`).join('');
  const rows = records.slice(-60).reverse().map(r => `<tr><td>${r.level}（${r.figure}${r.shape ? ' ' + r.shape : ''}）</td><td>${r.result === 'cleared' ? '過關' : r.result === 'skipped' ? '跳過' : '離開'}</td><td>${r.seconds} 秒</td><td>${r.undo}</td><td>${r.restart}</td><td>${r.hint}</td><td>${r.goodStarts}/${r.starts}</td></tr>`).join('');
  $('results').innerHTML = `<thead><tr><th>關卡</th><th>結果</th><th>花多久</th><th>退一步</th><th>重來</th><th>提示</th><th>選對起點</th></tr></thead><tbody>${rows || '<tr><td colspan="7">還沒有紀錄</td></tr>'}</tbody>`;
}
$('gear').onclick = () => { renderPanel(); $('panel').hidden = false; };
$('close-panel').onclick = () => { $('panel').hidden = true; };
$('jump').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (!done) saveRecord('left');
  loadLevel(+b.dataset.i); $('panel').hidden = true;
});
for (const id of ['kid-name', 'kid-age']) {
  $(id).value = store.get(id, '');
  $(id).addEventListener('change', () => store.set(id, $(id).value));
}

$('undo-btn').onclick = undo;
$('restart-btn').onclick = restart;
$('hint-btn').onclick = hint;
$('skip-btn').onclick = skip;
$('next-btn').onclick = () => { if (li < LEVELS.length - 1) loadLevel(li + 1); };
new ResizeObserver(() => { layout(); render(); }).observe(svg);
loadLevel(li);

(async () => {
  db = window.claude ? await window.claude.use('db') : null;
  $('db-status').textContent = db ? '紀錄存放：每過一關或跳過一關，紀錄會自動傳回去，也留一份在這台 iPad 上。' : '紀錄存放：連不上，紀錄只留在這台 iPad 上，下面的表格就是全部的紀錄。';
})();
</script>
