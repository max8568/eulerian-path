<title>一筆畫的樣子和聲音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a single review sheet — style switcher on top, then a phone-sized game screen beside the chapter, avatar and sound/animation pickers; stacks to one column on narrow screens. The page chrome is neutral; each of the three game styles is a self-contained token set on the preview. */
:root {
  --page: #F2F4F6; --sheet: #FFFFFF; --text: #1E2A33; --muted: #5E6E7A; --rule: #DCE2E7; --focus: #2F6FEB;
  --font-ui: "Fredoka", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121820; --sheet: #1B232C; --text: #E6ECF1; --muted: #9BAAB6; --rule: #2B3641; --focus: #7AA7FF; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #121820; --sheet: #1B232C; --text: #E6ECF1; --muted: #9BAAB6; --rule: #2B3641; --focus: #7AA7FF; color-scheme: dark; }
body { background: var(--page); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 26px; }
h2 { margin: 0 0 8px; font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.seg button { font: 500 15px var(--font-ui); padding: 8px 14px; border: 0; background: var(--sheet); color: var(--text); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--page); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cols { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--sheet); border-radius: 16px; padding: 16px; display: grid; gap: 10px; min-width: 0; }

/* ---- game preview: three styles, each its own token set */
.game {
  --bg: #EAF3F7; --ink: #1F3442; --todo: #B6C8D3; --draw: #F2542D; --here: #FFC93C; --hint: #1FA463; --btn: #FFFFFF; --btn-shadow: #D5E4EC; --dot: #FFFFFF;
  background: var(--bg); color: var(--ink); border-radius: 28px; aspect-ratio: 3 / 4.2; max-width: 100%;
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; position: relative; transition: background .3s;
}
.game[data-style="chalk"] { --bg: #23463A; --ink: #F4F1E6; --todo: rgba(244,241,230,.35); --draw: #FFE066; --here: #FF8FAB; --hint: #8CE99A; --btn: #2F5A4B; --btn-shadow: #183229; --dot: #23463A; }
.game[data-style="candy"] { --bg: #FFF7EE; --ink: #4A3B52; --todo: #E7D9EA; --draw: var(--chapter); --here: #FFD43B; --hint: #20C997; --btn: #FFFFFF; --btn-shadow: #F0E1F1; --dot: #FFFFFF; }
.g-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.g-top .title { flex: 1; text-align: center; font-weight: 600; font-size: 18px; }
.g-top .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 99px; background: var(--chapter); color: #fff; font-size: 14px; }
.g-round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--btn); color: var(--ink); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
.g-stage { position: relative; min-height: 0; }
.g-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.e-todo { stroke: var(--todo); stroke-width: 10; stroke-linecap: round; fill: none; }
.game[data-style="chalk"] .e-todo { stroke-dasharray: 2 14; }
.e-done { stroke: var(--draw); stroke-width: 12; stroke-linecap: round; fill: none; }
.v { fill: var(--dot); stroke: var(--ink); stroke-width: 4; }
.v-here { fill: var(--here); stroke: var(--ink); stroke-width: 4; }
.ring { fill: none; stroke: var(--here); stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
.g-tools { display: flex; justify-content: center; gap: 16px; padding: 10px 14px 16px; }
.g-tool { width: 64px; height: 64px; border-radius: 20px; border: 0; background: var(--btn); color: var(--ink); box-shadow: 0 4px 0 var(--btn-shadow); display: grid; place-items: center; cursor: pointer; }
.g-tool svg { width: 34px; height: 34px; }
.g-tool.hint { color: var(--hint); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.star { width: 130px; height: 130px; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
.jump { font-family: var(--font-emoji); font-size: 64px; animation: jump .5s ease-in-out 4 alternate; }
@keyframes jump { from { transform: translateY(20px) rotate(-8deg); } to { transform: translateY(-40px) rotate(8deg); } }
canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* ---- chapters and avatars */
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ch { border: 0; border-radius: 14px; padding: 8px 6px; color: #fff; background: var(--c); display: grid; justify-items: center; gap: 2px; cursor: pointer; font: 500 13px var(--font-ui); }
.ch[aria-pressed="true"] { outline: 3px solid var(--text); outline-offset: 2px; }
.ch .emo { font-family: var(--font-emoji); font-size: 30px; line-height: 1.2; }
.avatars { display: flex; flex-wrap: wrap; gap: 8px; }
.av { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--rule); background: var(--page); font-family: var(--font-emoji); font-size: 32px; cursor: pointer; }
.av[aria-pressed="true"] { border-color: var(--text); border-width: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.play { font: 500 14px var(--font-ui); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--page); color: var(--text); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .ring, .star, .jump { animation: none; } }
</style>

<main>
  <div>
    <h1>一筆畫的樣子和聲音</h1>
    <p class="muted">切換上面的風格，點右邊的章節、頭像、聲音和過關動畫試試看。聲音要先點一下畫面才會響（iPad 記得把靜音開關打開）。</p>
  </div>

  <div class="row">
    <strong>畫面風格</strong>
    <div class="seg" role="group" aria-label="畫面風格">
      <button data-style="paper" aria-pressed="true">A 淡藍紙張</button>
      <button data-style="chalk" aria-pressed="false">B 黑板粉筆</button>
      <button data-style="candy" aria-pressed="false">C 糖果色（線跟著章節變色）</button>
    </div>
  </div>

  <div class="cols">
    <div class="game" id="game" data-style="paper">
      <div class="g-top">
        <button class="g-round" aria-label="回選關">☰</button>
        <div class="title"><span class="chip" id="chip"><span id="chip-emo"></span><span id="chip-name"></span></span> 第 <span id="lvl"></span> 關</div>
        <button class="g-round" aria-label="跳過">⏭</button>
      </div>
      <div class="g-stage">
        <svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="g-tools">
        <button class="g-tool" aria-label="退一步"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10 6 18l8 8"/><path d="M6 18h18a10 10 0 0 1 0 20h-6"/></svg></button>
        <button class="g-tool" aria-label="重來"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 20a12 12 0 1 1-4-9"/><path d="M30 4v8h-8"/></svg></button>
        <button class="g-tool hint" aria-label="提示"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 27c0-4-5-6-5-13a11 11 0 0 1 22 0c0 7-5 9-5 13z"/><path d="M15 33h10M17 38h6"/></svg></button>
      </div>
    </div>

    <div style="display:grid; gap:16px; min-width:0">
      <section class="panel">
        <h2>20 章的顏色和圖示</h2>
        <p class="muted">點一章，左邊的畫面會換成那章的顏色。圖示用 emoji，iPad 上會顯示成蘋果的樣子。</p>
        <div class="chapters" id="chapters"></div>
      </section>
      <section class="panel">
        <h2>頭像</h2>
        <p class="muted">最多 3 個頭像，每個從這 12 隻動物裡挑一隻。點一隻，過關動畫「小動物跳」會用牠。</p>
        <div class="avatars" id="avatars"></div>
      </section>
      <section class="panel">
        <h2>聲音</h2>
        <div class="row">
          <div class="seg" role="group" aria-label="音色">
            <button data-sound="wood" aria-pressed="true">木琴</button>
            <button data-sound="chip" aria-pressed="false">電子遊戲</button>
          </div>
        </div>
        <div class="row">
          <button class="play" data-play="line">畫好一條線（連按會一路往上升）</button>
          <button class="play" data-play="win">過關</button>
          <button class="play" data-play="hint">按提示</button>
          <button class="play" data-play="stuck">走不下去</button>
        </div>
      </section>
      <section class="panel">
        <h2>過關動畫</h2>
        <div class="row">
          <button class="play" data-anim="star">大星星</button>
          <button class="play" data-anim="confetti">大星星加彩帶</button>
          <button class="play" data-anim="jump">大星星加小動物跳</button>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
const THEMES = [
  ['形狀','🔺'],['動物','🐸'],['家裡的東西','🏠'],['大自然','🌳'],['交通工具','🚗'],
  ['海洋','🐳'],['食物','🍎'],['昆蟲','🐞'],['建築','🏰'],['樂器','🎸'],
  ['運動','⚽'],['天氣','🌈'],['恐龍','🦕'],['農場','🐮'],['衣服','👕'],
  ['廚房','🍳'],['節日','🎄'],['太空','🚀'],['遊樂園','🎡'],['綜合','👑'],
];
const color = i => `hsl(${(i * 37 + 8) % 360} 62% 52%)`;
const ANIMALS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🐸','🐵','🐧','🐨','🦁'];
let chapter = 1, animal = '🐰', soundSet = 'wood';
const $ = id => document.getElementById(id);

// ---- the house figure, five of eight lines drawn, standing on the current point
const P = [[20,88],[80,88],[80,44],[20,44],[50,12]];
const E = [[0,1],[1,2],[2,3],[3,0],[3,4],[4,2],[0,2],[1,3]];
const DRAWN = 5, CUR = 2;
function drawFigure() {
  const s = $('svg');
  s.innerHTML = E.map(([a, b], i) => `<path class="${i < DRAWN ? 'e-done' : 'e-todo'}" d="M${P[a]}L${P[b]}" vector-effect="non-scaling-stroke"/>`).join('')
    + P.map((p, v) => v === CUR
      ? `<circle class="ring" cx="${p[0]}" cy="${p[1]}" r="3.4" vector-effect="non-scaling-stroke"/><circle class="v-here" cx="${p[0]}" cy="${p[1]}" r="3.4" vector-effect="non-scaling-stroke"/>`
      : `<circle class="v" cx="${p[0]}" cy="${p[1]}" r="2.8" vector-effect="non-scaling-stroke"/>`).join('');
}

function setChapter(i) {
  chapter = i;
  $('game').style.setProperty('--chapter', color(i - 1));
  $('chip-emo').textContent = THEMES[i - 1][1];
  $('chip-name').textContent = THEMES[i - 1][0];
  $('lvl').textContent = (i - 1) * 50 + 13;
  document.querySelectorAll('.ch').forEach((b, k) => b.setAttribute('aria-pressed', String(k + 1 === i)));
}
$('chapters').innerHTML = THEMES.map(([n, e], i) => `<button class="ch" style="--c:${color(i)}" aria-pressed="false"><span class="emo">${e}</span><span>${i + 1}. ${n}</span></button>`).join('');
document.querySelectorAll('.ch').forEach((b, i) => b.onclick = () => setChapter(i + 1));
$('avatars').innerHTML = ANIMALS.map(a => `<button class="av" aria-pressed="${a === animal}">${a}</button>`).join('');
document.querySelectorAll('.av').forEach(b => b.onclick = () => {
  animal = b.textContent;
  document.querySelectorAll('.av').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});
document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => {
  $('game').dataset.style = b.dataset.style;
  document.querySelectorAll('[data-style]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

// ---- sounds, made in the browser (no sound files): a xylophone-like tone and an 8-bit beep
let ac = null, lineStep = 0, lineReset = null;
const PENTA = [0, 2, 4, 7, 9];
const freq = step => 523.25 * Math.pow(2, (PENTA[step % 5] + 12 * Math.floor(step / 5)) / 12);
function tone(f, at, dur, vol = 0.25) {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = soundSet === 'wood' ? 'triangle' : 'square';
  o.frequency.setValueAtTime(f, t);
  const v = soundSet === 'wood' ? vol : vol * 0.4;
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SOUNDS = {
  line() { tone(freq(lineStep), 0, 0.25); lineStep = Math.min(lineStep + 1, 9); clearTimeout(lineReset); lineReset = setTimeout(() => lineStep = 0, 2500); },
  win() { [0, 2, 4, 5, 7].forEach((s, i) => tone(freq(s), i * 0.11, i === 4 ? 0.6 : 0.2)); },
  hint() { tone(1318.5, 0, 0.35, 0.15); tone(1760, 0.15, 0.45, 0.15); },
  stuck() { tone(220, 0, 0.22, 0.2); tone(174.6, 0.18, 0.35, 0.2); },
};
document.querySelectorAll('[data-sound]').forEach(b => b.onclick = () => {
  soundSet = b.dataset.sound;
  document.querySelectorAll('[data-sound]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  SOUNDS.line();
});
document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => SOUNDS[b.dataset.play]());

// ---- clear animations
const STAR = '<svg class="star" viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 37l30-3z" fill="#FFC93C" stroke="#1F3442" stroke-width="4" stroke-linejoin="round"/></svg>';
function confetti(host) {
  const c = document.createElement('canvas'); c.className = 'confetti'; host.appendChild(c);
  const w = c.width = host.clientWidth * 2, h = c.height = host.clientHeight * 2, x = c.getContext('2d');
  const bits = Array.from({ length: 90 }, () => ({ x: w / 2, y: h / 2, vx: (Math.random() - .5) * 26, vy: -Math.random() * 26 - 6, s: 8 + Math.random() * 10, c: `hsl(${Math.random() * 360} 80% 60%)`, r: Math.random() * 6 }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, w, h);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += 0.8; b.r += 0.2; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); x.restore(); }
    if (++f < 90) requestAnimationFrame(step); else c.remove();
  })();
}
document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => {
  const o = $('overlay'), kind = b.dataset.anim;
  o.innerHTML = kind === 'jump' ? `<div style="display:grid;justify-items:center">${STAR}<div class="jump">${animal}</div></div>` : STAR;
  if (kind === 'confetti') confetti($('game'));
  SOUNDS.win();
  setTimeout(() => { o.innerHTML = ''; }, 2600);
});

drawFigure();
setChapter(1);
</script>
